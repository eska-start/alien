<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>대장장이의 하루</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171411;color:#f4ead9;font-family:system-ui,'Noto Sans KR',sans-serif;overflow:hidden}button{font:inherit;border:0;cursor:pointer;color:inherit}#app{height:100dvh}.game{height:100%;max-width:1400px;margin:auto;position:relative;background:radial-gradient(circle at 50% 35%,#684226,#2a1a12 60%,#120d0a);overflow:hidden}.top{position:absolute;z-index:20;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center}.pill{background:#211812eF;border:1px solid #b98a52;padding:9px 12px;border-radius:14px;font-weight:800;box-shadow:0 8px 25px #0006}.pill.money{margin-left:auto}.workshop{position:absolute;inset:0}.wall{position:absolute;inset:0;background:linear-gradient(#39251b 0 58%,#241710 58%)}.brick{position:absolute;inset:0;opacity:.18;background:repeating-linear-gradient(0deg,transparent 0 42px,#d7a36b 43px 45px),repeating-linear-gradient(90deg,transparent 0 88px,#d7a36b 89px 91px)}.roof{position:absolute;left:0;right:0;top:55%;height:45%;background:linear-gradient(#3b281d,#1c120e);border-top:8px solid #8a5b34}.anvil{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:min(330px,42vw);height:120px;background:linear-gradient(#777,#252525);clip-path:polygon(7% 0,93% 0,100% 30%,80% 42%,72% 100%,28% 100%,20% 42%,0 30%);filter:drop-shadow(0 18px 15px #0008)}.forge{position:absolute;left:7%;bottom:12%;width:180px;height:210px;background:#30231c;border:8px solid #67432a;border-radius:18px;box-shadow:0 0 45px #f36b1d55}.fire{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);width:105px;height:105px;border-radius:50%;background:radial-gradient(circle,#fff6a0 0 12%,#ffb21e 35%,#d53b10 65%,transparent 70%);animation:pulse .7s infinite alternate}.flame{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%) rotate(45deg);width:48px;height:48px;background:#ffb21e;border-radius:50% 0 50% 50%;animation:flame .5s infinite alternate}@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.12)}}@keyframes flame{to{transform:translate(-50%,-50%) rotate(45deg) scale(1.12)}}.bench{position:absolute;right:6%;bottom:14%;width:260px;height:170px;background:#6d4529;border:8px solid #3b2417;border-radius:12px}.rack{position:absolute;right:8%;top:23%;font-size:70px;filter:drop-shadow(0 10px 5px #0007)}.ore{position:absolute;left:10%;top:22%;font-size:56px}.center{position:absolute;left:50%;top:9%;transform:translateX(-50%);text-align:center;width:min(680px,70%)}h1{margin:0;font-size:clamp(22px,4vw,38px);text-shadow:0 3px 12px #000}.sub{color:#cdb89e}.actions{position:absolute;z-index:30;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:7px;width:min(900px,calc(100% - 16px));background:#17110df0;padding:8px;border:1px solid #805a36;border-radius:18px}.actions button{flex:1;background:#3a281d;border:1px solid #775331;border-radius:12px;padding:10px 6px;font-weight:900;font-size:14px}.actions button:hover{background:#57402c}.modal{position:absolute;z-index:100;inset:0;background:#090604aa;display:flex;align-items:center;justify-content:center;padding:14px}.card{width:min(900px,96vw);max-height:92dvh;overflow:auto;background:#251a13;border:1px solid #9b6a3e;border-radius:22px;padding:20px;box-shadow:0 25px 80px #000b}.hidden{display:none!important}.head{display:flex;justify-content:space-between;align-items:center}.close{width:38px;height:38px;border-radius:50%;background:#493224}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item,.order{background:#33231a;border:1px solid #765132;border-radius:15px;padding:12px}.item button,.order button,.wide{width:100%;margin-top:8px;background:#81532d;border-radius:10px;padding:10px;font-weight:800}.notice{padding:12px;background:#17100c;border-radius:14px;margin:10px 0}.bar{height:12px;background:#130d0a;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#e77b24}.heat{height:30px;background:linear-gradient(90deg,#4b77a8,#9dd0d9,#ffe27a,#f36a1d,#8b170e);border-radius:10px;position:relative}.needle{position:absolute;top:-5px;width:4px;height:40px;background:white;left:20%;box-shadow:0 0 6px #000}.forgebox{text-align:center}.metal{margin:18px auto;width:min(520px,90%);height:120px;background:linear-gradient(90deg,#4c5963,#d3a05b,#5d6670);border-radius:18px;position:relative;touch-action:none;box-shadow:0 12px 25px #0008}.hammer{font-size:60px;position:absolute;left:50%;top:-55px;transform:translateX(-50%);user-select:none;touch-action:none}.targets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.target{height:55px;background:#493022;border:2px dashed #9b6a3e;border-radius:9px}.target.hit{background:#a7612e}.stars{font-size:24px;letter-spacing:3px}.weapon{font-size:80px;text-align:center;filter:drop-shadow(0 8px 8px #0008)}.small{font-size:12px;color:#c9b59c}.town{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.toast{position:absolute;z-index:200;left:50%;top:80px;transform:translateX(-50%);background:#f2dfb9;color:#24170f;padding:12px 18px;border-radius:14px;font-weight:900;box-shadow:0 8px 30px #0008;transition:.25s}.fade{opacity:0;pointer-events:none;transform:translate(-50%,-20px)}@media(max-width:650px){.forge{width:115px;height:150px;bottom:18%}.bench{width:150px;height:120px;right:3%;bottom:20%}.rack{font-size:46px;right:4%;top:26%}.ore{font-size:40px;left:4%;top:27%}.anvil{width:220px;height:90px}.center{width:92%;top:10%}.actions{gap:4px}.actions button{font-size:11px;padding:9px 2px}.grid,.town{grid-template-columns:1fr 1fr}.card{padding:14px}.metal{height:105px}.targets{grid-template-columns:repeat(5,1fr)}}
</style>

<body><div id="app"><main class="game">
<div class="wall"></div><div class="brick"></div><div class="roof"></div><div class="forge"><div class="fire"></div><div class="flame"></div></div><div class="anvil"></div><div class="bench"></div><div class="rack">⚔️ 🛡️</div><div class="ore">⛏️ 🪨</div>
<header class="top"><div class="pill">🔨 대장장이의 하루</div><div class="pill" id="day">DAY 1</div><div class="pill money" id="money">💰 300 G</div><div class="pill" id="rep">평판 0</div></header>
<div class="center"><h1 id="headline">낡은 대장간에 오신 것을 환영합니다</h1><div class="sub" id="sub">오늘 첫 주문을 받아 장인의 길을 시작하세요.</div></div>
<div id="toast" class="toast fade"></div>
<nav class="actions"><button onclick="openOrders()">📜 주문</button><button onclick="startForge()">🔥 제작</button><button onclick="openInventory()">🎒 재료</button><button onclick="openTown()">🏘️ 마을</button><button onclick="openJournal()">📖 기록</button><button onclick="endDay()">🌙 하루 종료</button></nav>

<script>
const KEY='blacksmith-day-v1';
const base={day:1,money:300,rep:0,materials:{iron:8,coal:10,silver:0,mithril:0,black:0},recipes:['iron_sword','iron_dagger','sickle'],orders:[],journal:[],stats:{made:0,good:0,failed:0}};
let s=load();
const $=x=>document.querySelector(x);
const mats={iron:{n:'철괴',icon:'🪨',price:30},coal:{n:'숯',icon:'⬛',price:10},silver:{n:'은',icon:'🥈',price:90},mithril:{n:'미스릴',icon:'💠',price:300},black:{n:'흑철',icon:'⬛',price:180}};
const recipes={iron_sword:{n:'철검',icon:'⚔️',need:{iron:2,coal:1},base:55},iron_dagger:{n:'철단검',icon:'🗡️',need:{iron:1,coal:1},base:35},sickle:{n:'낫',icon:'🌙',need:{iron:2},base:42},silver_sword:{n:'은검',icon:'✨⚔️',need:{silver:2,coal:1},base:78},mithril_sword:{n:'미스릴검',icon:'💠⚔️',need:{mithril:2,coal:2},base:105},black_blade:{n:'흑철검',icon:'🖤⚔️',need:{black:2,coal:3},base:120}};
function load(){try{return {...base,...JSON.parse(localStorage.getItem(KEY))}}catch(e){return structuredClone(base)}}
function save(){localStorage.setItem(KEY,JSON.stringify(s));update()}
function update(){$('#day').textContent='DAY '+s.day;$('#money').textContent='💰 '+s.money+' G';$('#rep').textContent='평판 '+s.rep}
function toast(t){const x=$('#toast');x.textContent=t;x.classList.remove('fade');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.add('fade'),1800)}
function openModal(t,h){$('#mt').textContent=t;$('#mb').innerHTML=h;$('#modal').classList.remove('hidden')}
function closeModal(){$('#modal').classList.add('hidden')}
function openOrders(){if(!s.orders.length)generateOrders();openModal('📜 오늘의 주문',s.orders.map((o,i)=>'<div class="order"><b>'+o.name+'</b><p>'+o.desc+'</p><div class="small">보상 '+o.reward+' G · 조건 '+o.min+' 품질</div><button onclick="startForge('+i+')">'+(o.done?'완료':'제작하기')+'</button></div>').join(''))}
function generateOrders(){const pool=[['농부의 낫','튼튼한 낫을 부탁하오.',110,45,'sickle'],['모험가의 검','고블린을 상대할 검이 필요하다.',220,55,'iron_sword'],['여행자의 단검','가벼운 단검 하나.',150,50,'iron_dagger']];if(s.day>=3)pool.push(['은사냥꾼의 검','밤의 마물을 위한 은검.',500,70,'silver_sword']);if(s.day>=5)pool.push(['귀족의 비밀 주문','검은 금속으로 만든 검.',850,80,'black_blade']);s.orders=pool.slice(0,Math.min(3,2+Math.floor(s.day/3))).map(x=>({name:x[0],desc:x[1],reward:x[2],min:x[3],recipe:x[4],done:false}))}
function canMake(r){return Object.entries(r.need).every(([k,v])=>(s.materials[k]||0)>=v)}
function consume(r){Object.entries(r.need).forEach(([k,v])=>s.materials[k]-=v)}
function startForge(orderIndex=null){let order=orderIndex!==null?s.orders[orderIndex]:null;let keys=Object.keys(recipes).filter(k=>s.recipes.includes(k)||k==='iron_sword'||k==='iron_dagger'||k==='sickle');openModal('🔥 대장간 제작',`
<div class="notice">${order?'주문: <b>'+order.name+'</b><br>'+order.desc:'자유 제작 — 완성품을 판매하거나 다음 주문에 사용하세요.'}</div>
<div class="grid">${keys.map(k=>{let r=recipes[k];return '<div class="item"><div class="weapon">'+r.icon+'</div><b>'+r.n+'</b><div class="small">'+Object.entries(r.need).map(([m,v])=>mats[m].icon+' '+v).join(' · ')+'</div><button onclick="heatForge(\''+k+'\','+(orderIndex===null?'null':orderIndex)+')">'+(canMake(r)?'제작':'재료 부족')+'</button></div>'}).join('')}</div>`)}
function heatForge(k,oi){const r=recipes[k];if(!canMake(r)){toast('재료가 부족합니다.');return}consume(r);let temp=20;openModal('🔥 STEP 1 · 가열',`
<div class="forgebox"><p>금속이 적정 온도에 도달하면 <b>꺼내기</b>를 누르세요.</p><div class="heat"><i class="needle" id="needle"></i></div><div class="stat" id="temp">온도 20%</div><button class="wide" onclick="hammerForge('${k}',${oi})">적정 온도에서 꺼내기</button></div>`);const timer=setInterval(()=>{temp+=Math.random()*7+3;$('#needle').style.left=Math.min(98,temp)+'%';$('#temp').textContent='온도 '+Math.floor(temp)+'%';if(temp>=100){temp=100;clearInterval(timer);$('#temp').textContent='과열! 품질에 불리합니다.'}},220);window.heatTimer=timer}
function hammerForge(k,oi){clearInterval(window.heatTimer);let hits=0,score=0;openModal('🔨 STEP 2 · 망치질',`
<p>철괴의 위치를 <b>직접 터치하거나 클릭</b>해 8번 두드리세요. 여러 부위를 골고루 치면 균형이 좋아집니다.</p><div class="metal" id="metal"><div class="hammer" id="hammer">🔨</div><div class="targets">${[0,1,2,3,4].map(i=>'<button class="target" onclick="hit('+i+')"></button>').join('')}</div></div><div class="notice" id="hits">0 / 8 타격</div><button class="wide" onclick="quenchForge('${k}',${oi})">다음: 담금질</button></div>`);window.hit=(i)=>{if(hits>=8)return;hits++;score+=i===Math.floor((hits-1)%5)?6:10;document.querySelectorAll('.target')[i].classList.add('hit');$('#hammer').style.transform='translateX('+((i-2)*25)+'%) rotate(-28deg)';setTimeout(()=>$('#hammer').style.transform='translateX(-50%)',90);$('#hits').textContent=hits+' / 8 타격';}}
function quenchForge(k,oi){let q=null;openModal('💧 STEP 3 · 담금질',`<p>방식을 선택하세요. 제작품의 성질이 달라집니다.</p><div class="grid"><button class="wide" onclick="polishForge('${k}',${oi},'water')">💧 물 — 경도 증가</button><button class="wide" onclick="polishForge('${k}',${oi},'oil')">🛢️ 기름 — 균형</button><button class="wide" onclick="polishForge('${k}',${oi},'magic')">🔮 특수액 — 희귀 효과</button></div>`)}
function polishForge(k,oi,q){openModal('✨ STEP 4 · 연마',`<p>연마석 위를 <b>좌우로 드래그</b>하세요. 6회 정도가 적당합니다.</p><div class="metal" id="polish"><div style="font-size:70px">⚔️</div></div><div class="bar"><i id="polishbar" style="width:0%"></i></div><div class="notice" id="polishmsg">0 / 6</div><button class="wide" onclick="finishForge('${k}',${oi},'${q}')">완성하기</button></div>`);let n=0,last=0;const p=$('#polish');p.onpointermove=e=>{if(e.buttons){let now=Date.now();if(now-last>140){n++;last=now;$('#polishbar').style.width=Math.min(100,n/6*100)+'%';$('#polishmsg').textContent=n+' / 6';}}}}
function finishForge(k,oi,q){const r=recipes[k];let quality=Math.round(r.base+Math.random()*25+(q==='oil'?5:q==='water'?2:10));quality=Math.min(100,quality);let grade=quality>=90?'SS':quality>=80?'S':quality>=70?'A':quality>=60?'B':quality>=50?'C':'D';s.stats.made++;if(quality>=70)s.stats.good++;else s.stats.failed++;const order=oi!==null?s.orders[oi]:null;if(order){if(k===order.recipe&&quality>=order.min&&!order.done){order.done=true;s.money+=order.reward;s.rep+=10;toast('주문 납품 성공! +'+order.reward+' G');}}else{s.money+=Math.floor(quality*2)}if(quality>=75&&s.day>=2&&!s.recipes.includes('silver_sword'))s.recipes.push('silver_sword');if(quality>=85&&s.day>=4&&!s.recipes.includes('black_blade'))s.recipes.push('black_blade');s.journal.push('DAY '+s.day+' '+r.n+' '+grade+'('+quality+')');save();openModal('⚒️ 제작 완료',`<div class="weapon">${r.icon}</div><h2 style="text-align:center">${r.n}</h2><div class="stars">${'★'.repeat(Math.ceil(quality/20))}${'☆'.repeat(5-Math.ceil(quality/20))}</div><div class="notice">품질 <b>${grade}</b> · ${quality}/100<br>재료와 제작 과정이 결과에 반영되었습니다.<br>${q==='magic'?'특수 효과: 고대의 불꽃':''}</div><button class="wide" onclick="closeModal()">대장간으로 돌아가기</button>`)}
function openInventory(){openModal('🎒 재료 창고','<div class="grid">'+Object.entries(mats).map(([k,m])=>'<div class="item">'+m.icon+' <b>'+m.n+'</b><br>보유 '+(s.materials[k]||0)+'<br><button onclick="buyMat(\''+k+'\')">'+m.price+' G 구매</button></div>').join('')+'</div>')}
function buyMat(k){let p=mats[k].price;if(s.money<p){toast('돈이 부족합니다.');return}s.money-=p;s.materials[k]=(s.materials[k]||0)+1;save();openInventory();toast(mats[k].n+' 1개 구입')}
function openTown(){openModal('🏘️ 마을','<div class="town"><div class="item"><h3>⛏️ 광산</h3><p>철과 희귀 광석을 구매할 수 있습니다.</p><button onclick="mine()">광산 탐색</button></div><div class="item"><h3>🏪 시장</h3><p>오늘은 철괴가 '+(s.day%2?'싸다':'비싸다')+'.</p><button onclick="openInventory()">시장 가기</button></div><div class="item"><h3>🍺 여관</h3><p>마을의 소문을 들을 수 있습니다.</p><button onclick="rumor()">소문 듣기</button></div><div class="item"><h3>🛠️ 작업장</h3><p>평판 20 이상이면 고급 설비를 해금합니다.</p><button onclick="upgrade()">설비 확인</button></div></div>')}
function mine(){let gain=Math.random()<.2?'silver':'iron';s.materials[gain]++;save();toast('탐험에서 '+mats[gain].n+'을 발견했습니다!')}
function rumor(){const lines=['폐광 깊은 곳에서 검은 금속을 봤다는 사람이 있소.','왕실 문양이 새겨진 검이 북쪽 유적에서 발견됐다는군.','밤마다 오래된 대장간에서 불빛이 보인다는 소문이 있소.'];s.journal.push('소문: '+lines[(s.day-1)%lines.length]);save();openTown();toast('새로운 기록을 얻었습니다.')}
function upgrade(){if(s.rep<20){toast('평판 20이 필요합니다.');return}if(s.money<500){toast('설비 비용 500 G가 필요합니다.');return}s.money-=500;s.rep+=5;save();toast('모루와 화로를 업그레이드했습니다!')}
function openJournal(){openModal('📖 대장장이의 기록',`<div class="notice">제작 ${s.stats.made} · 좋은 품질 ${s.stats.good} · 실패/저품질 ${s.stats.failed}</div><p>발견한 기록</p><div class="notice">${s.journal.length?s.journal.slice(-15).map(x=>'• '+x).join('<br>'):'아직 기록이 없습니다.'}</div>`)}
function endDay(){if(!s.orders.length)generateOrders();const done=s.orders.filter(x=>x.done).length;const bonus=done*50;s.money+=bonus;s.day++;s.orders=[];if(s.day===3&&!s.journal.includes('왕국의 문양'))s.journal.push('왕국의 문양 — 오래된 검에서 같은 문양을 발견했다.');if(s.day===6)s.journal.push('고대 대장장이 길드 — 사라진 장인들의 기록이 존재한다.');if(s.day>=8&&s.rep>=40){finalChoice();return}save();openModal('🌙 하루 결과',`<div class="notice"><b>DAY ${s.day-1} 결과</b><br>완료 주문 ${done}개<br>보너스 ${bonus} G<br>현재 자금 ${s.money} G<br>평판 ${s.rep}</div><p>새로운 날이 밝았습니다.</p><button class="wide" onclick="closeModal();generateOrders()">다음 날 시작</button>`)}
function finalChoice(){openModal('👑 마지막 의뢰',`<div class="weapon">⚔️</div><h2>왕의 검</h2><p>고대 대장장이 길드의 진실이 담긴 검을 완성했습니다. 이제 기록의 운명을 결정해야 합니다.</p><div class="grid"><button class="wide" onclick="ending('왕국의 대장장이')">왕국에 넘긴다</button><button class="wide" onclick="ending('진실의 기록자')">기록을 보존한다</button><button class="wide" onclick="ending('독립 대장장이')">진실을 공개한다</button></div>`)}
function ending(type){s.journal.push('ENDING: '+type);save();openModal('🏆 엔딩',`<div class="weapon">⚔️</div><h1 style="text-align:center">${type}</h1><p style="text-align:center">당신은 대장간에서 시작해 자신의 선택으로 왕국의 역사를 바꾸었습니다.</p><div class="notice">총 제작 ${s.stats.made} · 평판 ${s.rep} · 보유금 ${s.money} G · DAY ${s.day}</div><button class="wide" onclick="newGame()">새 게임</button>`)}
function newGame(){localStorage.removeItem(KEY);s=load();location.reload()}
update();
setTimeout(()=>{if(!s.orders.length)generateOrders()},100);
</script></body></html>
