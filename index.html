<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#11100f">
<title>대장장이의 하루 — Ember & Steel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--bg:#0d0c0b;--panel:#171513;--panel2:#211d19;--line:#40372f;--gold:#e4a84b;--gold2:#ffd98a;--ember:#e8663c;--steel:#aeb8c2;--text:#f3eee6;--muted:#a99f93;--good:#83c98c;--bad:#d96b63}
*{box-sizing:border-box}html,body{margin:0;background:#090909;color:var(--text);font-family:"Noto Sans KR",sans-serif;min-height:100%;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 10%,#2b2119 0,#0d0c0b 42%,#070707 100%)}
.top{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #352d27;background:rgba(12,11,10,.9);backdrop-filter:blur(14px);z-index:5}
.brand{display:flex;align-items:center;gap:12px}.sigil{width:38px;height:38px;border:1px solid #75552f;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#3a2a19,#14110e);box-shadow:0 0 20px #d86a2820}
.sigil:after{content:"";width:13px;height:20px;border:2px solid var(--gold);border-top:0;transform:rotate(45deg);border-radius:2px}.brand b{font-family:"Gowun Batang",serif;font-size:19px;letter-spacing:-.5px}.brand span{display:block;font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.stats{display:flex;gap:10px}.stat{min-width:90px;padding:7px 11px;border:1px solid #352e28;border-radius:10px;background:#141210}.stat small{display:block;color:var(--muted);font-size:10px}.stat strong{font-size:14px}.main{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(420px,1fr) 300px;gap:12px;padding:12px}
.panel{background:linear-gradient(180deg,#1b1815,#12110f);border:1px solid #383029;border-radius:16px;box-shadow:0 16px 50px #0008;min-height:0;overflow:hidden}.panelhead{padding:15px 16px;border-bottom:1px solid #332c26;display:flex;align-items:center;justify-content:space-between}.panelhead h3{margin:0;font-size:13px}.panelhead span{font-size:10px;color:var(--muted)}
.orders{overflow:auto;padding:10px}.order{position:relative;padding:13px;margin-bottom:8px;border:1px solid #352f29;border-radius:12px;background:#151311;transition:.18s}.order.active{border-color:#9a6934;box-shadow:inset 3px 0 var(--gold),0 0 18px #e2a84b10}.order.done{opacity:.55}.order .who{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.order b{display:block;margin:5px 0 7px;font-family:"Gowun Batang",serif;font-size:16px}.tag{display:inline-flex;padding:3px 6px;border-radius:5px;background:#2a2118;color:var(--gold2);font-size:9px}.reward{float:right;color:var(--gold2);font-size:10px}
.workshop{position:relative;overflow:hidden;background:linear-gradient(180deg,#17130f 0%,#231810 52%,#100d0b 100%);border-radius:16px;min-height:0}.workshop:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 24% 42%,#ff9c4d14 0,transparent 18%),radial-gradient(circle at 75% 18%,#d8a85c10 0,transparent 25%),linear-gradient(90deg,transparent 49%,#0003 50%,transparent 51%);pointer-events:none}
.beams{position:absolute;inset:0;background:linear-gradient(90deg,transparent 0 13%,#0a0908 13% 15%,transparent 15% 83%,#0a0908 83% 85%,transparent 85%);opacity:.55}
.worktitle{position:absolute;left:22px;top:18px;z-index:2}.worktitle small{color:#9c8e7d;font-size:10px;letter-spacing:2px}.worktitle h1{font-family:"Gowun Batang",serif;font-size:27px;margin:2px 0}.worktitle p{margin:0;color:#9f9589;font-size:11px}.scene{position:absolute;inset:0}.table{position:absolute;left:8%;right:8%;bottom:7%;height:30%;border-radius:22px 22px 10px 10px;background:linear-gradient(180deg,#503321,#2a1a12 20%,#17100c);border:1px solid #70472c;box-shadow:0 -20px 45px #0008 inset}.table:after{content:"";position:absolute;left:7%;right:7%;top:17%;height:3px;background:#8b5a35;box-shadow:0 90px #100b09}.anvil{position:absolute;left:40%;bottom:23%;width:150px;height:95px;z-index:2}.anvil .horn{position:absolute;right:-36px;top:8px;width:62px;height:40px;background:linear-gradient(180deg,#8d9499,#3f464a);clip-path:polygon(0 20%,100% 45%,0 80%);filter:drop-shadow(0 8px 6px #0008)}.anvil .body{position:absolute;left:15px;top:12px;width:104px;height:56px;background:linear-gradient(180deg,#929a9e,#4b5154);clip-path:polygon(8% 0,92% 0,100% 25%,85% 100%,20% 100%,0 25%);box-shadow:0 15px 15px #000}.anvil .leg{position:absolute;bottom:-25px;width:25px;height:38px;background:#34393b}.anvil .leg.l{left:28px}.anvil .leg.r{right:30px}.fire{position:absolute;left:16%;bottom:21%;width:150px;height:120px;z-index:2}.forge{position:absolute;inset:25px 0 0;background:linear-gradient(180deg,#5b4030,#201510);border:1px solid #7c4b2d;border-radius:12px 12px 4px 4px;box-shadow:0 12px 20px #000}.coals{position:absolute;left:25px;right:25px;top:10px;height:55px;border-radius:50%;background:radial-gradient(circle,#fff2a0 0 5%,#ff8d36 8% 20%,#c43620 32%,#42150e 60%);box-shadow:0 0 35px #ff6a28aa;animation:pulse 1.1s infinite alternate}.chimney{position:absolute;left:35px;top:-55px;width:80px;height:75px;border:10px solid #31251d;border-bottom:0}.fire .heat{position:absolute;bottom:-30px;left:0;right:0;text-align:center;font-size:10px;color:#e8aa61}.hammer{position:absolute;left:58%;bottom:30%;width:105px;height:105px;z-index:3;transform:rotate(-28deg);filter:drop-shadow(0 12px 8px #0009)}.hammer:before{content:"";position:absolute;left:47px;top:35px;width:12px;height:72px;background:linear-gradient(90deg,#57351f,#b17845,#4a2c1b);border-radius:8px}.hammer:after{content:"";position:absolute;left:15px;top:8px;width:72px;height:42px;background:linear-gradient(180deg,#d1d7d8,#666d70);border-radius:10px 13px 13px 10px;box-shadow:inset 0 -6px #41474a}.npc{position:absolute;right:14%;bottom:19%;width:125px;height:205px;z-index:2}.npc .head{position:absolute;left:39px;top:5px;width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#f1c4a0,#b36e54);border:3px solid #3a2118}.npc .hair{position:absolute;left:36px;top:0;width:70px;height:38px;border-radius:40px 40px 15px 15px;background:#34261f}.npc .body{position:absolute;left:20px;top:65px;width:88px;height:125px;border-radius:35px 35px 14px 14px;background:linear-gradient(145deg,#43505b,#20252a);border:1px solid #66727b}.npc .arm{position:absolute;top:83px;width:22px;height:95px;background:#3b454d;border-radius:14px}.npc .arm.a{left:9px;transform:rotate(14deg)}.npc .arm.b{right:8px;transform:rotate(-22deg)}.npc .label{position:absolute;top:-28px;left:0;width:125px;text-align:center;color:#d5c6b4;font-size:11px}
.anvil .bar{position:absolute;left:40px;top:35px;width:70px;height:9px;background:linear-gradient(90deg,#4c3c32,#ffcc6b,#d7e1e4);box-shadow:0 0 20px #ff9b39;transform:rotate(-3deg);z-index:4}
.actionbar{position:absolute;left:6%;right:6%;bottom:20px;height:58px;border:1px solid #473a2e;background:#11100eeb;border-radius:14px;display:flex;align-items:center;gap:8px;padding:7px;z-index:6;backdrop-filter:blur(12px)}.action{height:44px;padding:0 16px;border-radius:10px;background:#201b17;border:1px solid #40352c;font-weight:700;font-size:12px}.action.primary{background:linear-gradient(180deg,#a66b32,#71441f);border-color:#c18a4d;box-shadow:0 5px 16px #0008}.action:disabled{opacity:.35;cursor:not-allowed}.phase{margin-left:auto;font-size:10px;color:#a99f93}.rightbody{padding:12px;overflow:auto}.recipe{padding:12px;border:1px solid #39312b;border-radius:11px;background:#151311;margin-bottom:9px}.recipe.selected{border-color:#8d6032;background:#211a14}.recipe h4{margin:0 0 6px;font-size:12px}.recipe p{margin:0;color:#9f958b;font-size:10px;line-height:1.5}.matgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.mat{padding:9px;border:1px solid #39312b;border-radius:9px;background:#141210}.mat b{display:block;font-size:11px}.mat span{font-size:10px;color:var(--muted)}.progress{height:6px;background:#2c2722;border-radius:9px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c86a2e,#ffd17a);transition:width .15s}.toast{position:absolute;left:50%;top:18%;transform:translateX(-50%) translateY(-10px);padding:11px 18px;background:#151210eF;border:1px solid #70502e;border-radius:10px;color:#ffe1a6;font-size:12px;opacity:0;pointer-events:none;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.modal{position:absolute;inset:0;background:#050505b8;backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modal.open{display:flex}.card{width:min(520px,94vw);max-height:90vh;overflow:auto;background:linear-gradient(180deg,#24201b,#12100e);border:1px solid #65503b;border-radius:20px;box-shadow:0 30px 100px #000; padding:25px}.card .eyebrow{color:#d69b50;font-size:10px;letter-spacing:2px}.card h2{font-family:"Gowun Batang",serif;font-size:28px;margin:5px 0 10px}.card p{color:#b0a69b;font-size:12px;line-height:1.8}.choicegrid{display:grid;gap:8px;margin-top:16px}.choice{padding:13px;text-align:left;background:#1a1714;border:1px solid #40372f;border-radius:10px}.choice:hover{border-color:#a8743b;background:#241c15}.meter{height:16px;background:#2a2521;border:1px solid #493d33;border-radius:9px;overflow:hidden;position:relative}.meter i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#5f8da0,#e6d178,#e65e37)}.target{position:absolute;top:-1px;height:18px;width:3px;background:#fff}.mini{margin-top:14px}.dragzone{height:150px;border:1px dashed #6a5038;border-radius:12px;display:grid;place-items:center;color:#a99f93;background:radial-gradient(circle,#2b1b12,#151210)}.loot{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.chip{padding:7px 9px;border-radius:8px;background:#211c18;border:1px solid #42382f;font-size:10px}.end{font-size:14px!important;color:#d9c7b3!important}.footerhint{font-size:10px;color:#81786e;margin-top:12px}
@keyframes pulse{from{transform:scale(.96);filter:brightness(.9)}to{transform:scale(1.04);filter:brightness(1.18)}}@keyframes hit{0%{transform:rotate(-28deg)}40%{transform:rotate(25deg)}100%{transform:rotate(-28deg)}}.hammer.hit{animation:hit .24s ease}
@media(max-width:1050px){.main{grid-template-columns:210px minmax(380px,1fr) 250px}.npc{right:7%}.anvil{left:39%}}@media(max-width:820px){html,body{overflow:hidden}.top{height:58px;padding:0 12px}.brand b{font-size:15px}.brand span{display:none}.sigil{width:32px;height:32px}.stats{gap:4px}.stat{min-width:62px;padding:5px 7px}.stat small{font-size:8px}.stat strong{font-size:11px}.main{padding:7px;display:block;position:relative}.left,.right{display:none}.workshop{height:calc(100dvh - 72px);border-radius:13px}.worktitle{left:15px;top:13px}.worktitle h1{font-size:22px}.npc{right:7%;bottom:23%;transform:scale(.78);transform-origin:bottom right}.anvil{left:38%;bottom:28%;transform:scale(.8)}.fire{left:7%;bottom:26%;transform:scale(.78)}.hammer{left:52%;bottom:34%;transform:scale(.78)}.table{left:3%;right:3%;bottom:11%;height:27%}.actionbar{left:3%;right:3%;bottom:7px;height:54px}.action{padding:0 11px;font-size:10px}.phase{font-size:9px}.modal{padding:10px}.card{padding:20px}.mobiletab{display:flex!important}}.mobiletab{display:none}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="sigil"></div><div><b>대장장이의 하루</b><span>EMBER & STEEL</span></div></div>
 <div class="stats"><div class="stat"><small>DAY</small><strong id="day">1 / 7</strong></div><div class="stat"><small>GOLD</small><strong id="gold">120 G</strong></div><div class="stat"><small>REPUTATION</small><strong id="rep">0</strong></div></div>
</header>
<main class="main">
 <aside class="panel left"><div class="panelhead"><h3>오늘의 의뢰</h3><span id="ordersLeft">3 ORDERS</span></div><div class="orders" id="orders"></div></aside>
 <section class="workshop">
  <div class="beams"></div>
  <div class="worktitle"><small>THE OLD FORGE</small><h1 id="sceneTitle">불씨를 살려라</h1><p id="sceneDesc">오늘도 쇠와 약속을 지키는 날이다.</p></div>
  <div class="scene">
   <div class="fire"><div class="chimney"></div><div class="forge"></div><div class="coals"></div><div class="heat" id="heatText">화로 0%</div></div>
   <div class="anvil"><div class="horn"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="bar" id="bar"></div></div>
   <div class="hammer" id="hammer"></div>
   <div class="npc"><div class="label" id="npcName">손님이 기다리고 있다</div><div class="hair"></div><div class="head"></div><div class="body"></div><div class="arm a"></div><div class="arm b"></div></div>
   <div class="table"></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="actionbar">
   <button class="action" id="orderBtn">의뢰 확인</button><button class="action" id="recipeBtn">제작대</button><button class="action primary" id="workBtn">작업 시작</button><button class="action" id="townBtn">마을</button><button class="action" id="dayBtn">하루 마감</button><span class="phase" id="phase">대기 중</span>
  </div>
  <div class="modal" id="modal"><div class="card" id="modalCard"></div></div>
 </section>
 <aside class="panel right"><div class="panelhead"><h3>작업대</h3><span id="recipeCount">6 RECIPES</span></div><div class="rightbody">
  <div id="recipeList"></div><div class="panelhead" style="margin:12px -12px 8px"><h3>재료 창고</h3><span>STOCK</span></div><div class="matgrid" id="mats"></div>
 </div></aside>
</main>
</div>
<script>
(()=>{"use strict";
const $=s=>document.querySelector(s);
const state={day:1,gold:120,rep:0,heat:0,quality:0,phase:"idle",orderIndex:0,completed:0,selectedRecipe:"ironSword",inventory:{iron:8,coal:12,silver:3,mithril:1,leather:4},orders:[],upgrades:0,story:0};
const recipes=[
{id:"ironSword",name:"견습 기사검",need:{iron:2,coal:2},base:55,diff:1,desc:"균형이 좋아 수련병이 선호한다."},
{id:"ironDagger",name:"사냥용 단검",need:{iron:1,coal:1,leather:1},base:42,diff:1,desc:"가볍고 빠른 손놀림이 생명이다."},
{id:"sickle",name:"농부의 낫",need:{iron:2,coal:1},base:48,diff:1,desc:"이번 수확철에 꼭 필요한 물건."},
{id:"silverSword",name:"은빛 결투검",need:{iron:1,silver:2,coal:2},base:110,diff:2,desc:"정교한 온도 제어가 필요하다."},
{id:"mithrilSword",name:"미스릴 장검",need:{mithril:1,iron:1,coal:3},base:180,diff:3,desc:"희귀한 광석. 실수하면 손해가 크다."},
{id:"blackBlade",name:"흑철 의식검",need:{iron:3,coal:4,leather:1},base:145,diff:3,desc:"검은 광택을 살리는 마지막 연마가 핵심."}
];
const orderNames=["마을 수비대","약초상 세라","떠돌이 기사","상단 주인","성의 사자","정체불명의 손님"];
const orderItems=[["ironSword","견습 기사검"],["sickle","농부의 낫"],["ironDagger","사냥용 단검"],["silverSword","은빛 결투검"],["blackBlade","흑철 의식검"],["mithrilSword","미스릴 장검"]];
function save(){localStorage.setItem("ember-steel-v3",JSON.stringify(state))}
function load(){try{Object.assign(state,JSON.parse(localStorage.getItem("ember-steel-v3")||"{}"))}catch(e){}}
function makeOrders(){state.orders=[];for(let i=0;i<3;i++){let n=(state.day+i+state.story)%orderItems.length;let [id,name]=orderItems[n];state.orders.push({who:orderNames[(state.day+i)%orderNames.length],id,name,reward:recipes.find(r=>r.id===id).base+state.day*5,min:70+recipes.find(r=>r.id===id).diff*5,done:false})}state.orderIndex=0}
function render(){ $("#day").textContent=state.day+" / 7";$("#gold").textContent=state.gold+" G";$("#rep").textContent=state.rep;$("#ordersLeft").textContent=state.orders.filter(o=>!o.done).length+" ORDERS";$("#phase").textContent={idle:"대기 중",heat:"가열 중",hammer:"망치질",quench:"담금질",polish:"연마 중",result:"품질 판정"}[state.phase]||state.phase;
$("#heatText").textContent="화로 "+state.heat+"%";
$("#bar").style.background=state.phase==="hammer"?"linear-gradient(90deg,#ff8b38,#fff0a0,#fff)":"linear-gradient(90deg,#4c3c32,#ffcc6b,#d7e1e4)";
renderOrders();renderRecipes();renderMats()}
function renderOrders(){const el=$("#orders");el.innerHTML=state.orders.map((o,i)=>'<div class="order '+(o.done?"done ":"")+(i===state.orderIndex&&!o.done?"active":"")+'><div class="who"><span>'+o.who+'</span><span>'+o.reward+' G</span></div><b>'+o.name+'</b><span class="tag">품질 '+o.min+'+</span></div>').join("")}
function renderRecipes(){const el=$("#recipeList");el.innerHTML=recipes.map(r=>'<div class="recipe '+(state.selectedRecipe===r.id?"selected":"")+'" data-r="'+r.id+'"><h4>'+r.name+'</h4><p>'+r.desc+'</p><div class="loot">'+Object.entries(r.need).map(([k,v])=>'<span class="chip">'+k+' × '+v+'</span>').join("")+'</div></div>').join("");el.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>{state.selectedRecipe=x.dataset.r;render()})}
function renderMats(){const names={iron:"철",coal:"석탄",silver:"은",mithril:"미스릴",leather:"가죽"};$("#mats").innerHTML=Object.entries(state.inventory).map(([k,v])=>'<div class="mat"><b>'+names[k]+'</b><span>'+v+'개</span></div>').join("")}
function toast(t){const x=$("#toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1900)}
function openModal(html){$("#modalCard").innerHTML=html;$("#modal").classList.add("open")}
function closeModal(){ $("#modal").classList.remove("open")}
function hasNeed(r){return Object.entries(r.need).every(([k,v])=>(state.inventory[k]||0)>=v)}
function spend(r){Object.entries(r.need).forEach(([k,v])=>state.inventory[k]-=v)}
function startWork(){if(state.phase!=="idle"){toast("현재 작업을 먼저 마무리하세요.");return}const r=recipes.find(x=>x.id===state.selectedRecipe);if(!hasNeed(r)){toast("재료가 부족합니다.");return}spend(r);state.phase="heat";state.heat=0;state.quality=0;render();heatModal()}
function heatModal(){openModal('<div class="eyebrow">01 · FORGE</div><h2>쇠를 달궈라</h2><p>게이지가 <b>황금 구간</b>에 들어왔을 때 멈추면 좋습니다. 너무 오래 달구면 강도가 떨어집니다.</p><div class="meter"><i id="heatFill"></i><span class="target" style="left:68%"></span></div><div class="mini"><button class="action primary" id="heatStop">가열 멈추기</button></div><div class="footerhint">스페이스바도 사용할 수 있습니다.</div>');let t=0;let timer=setInterval(()=>{t=(t+1)%101;$("#heatFill").style.width=t+"%";state.heat=t},35);$("#heatStop").onclick=()=>{clearInterval(timer);state.heat=t;state.quality=Math.max(0,45-Math.abs(t-68)*.8);closeModal();state.phase="hammer";render();hammerModal()}}
function hammerModal(){openModal('<div class="eyebrow">02 · TEMPER</div><h2>모루 위의 한 방</h2><p>밝게 빛나는 순간에 <b>망치 버튼</b>을 눌러 형태를 잡으세요. 5번의 타격으로 완성됩니다.</p><div class="meter"><i id="hammerFill"></i><span class="target" style="left:72%"></span></div><div class="mini"><button class="action primary" id="hitBtn">망치질</button></div><div class="footerhint">총 5회. 타이밍이 좋을수록 품질이 올라갑니다.</div>');let hits=0;let score=0;let fill=0;const loop=setInterval(()=>{fill=(fill+4)%101;const f=$("#hammerFill");if(f)f.style.width=fill+"%"},35);$("#hitBtn").onclick=()=>{hits++;const diff=Math.abs(fill-72);score+=Math.max(0,20-diff/2);$("#hammer").classList.add("hit");setTimeout(()=>$("#hammer").classList.remove("hit"),230);if(hits>=5){clearInterval(loop);state.quality+=score/5;closeModal();state.phase="quench";render();quenchModal()}}}
function quenchModal(){openModal('<div class="eyebrow">03 · QUENCH</div><h2>담금질의 순간</h2><p>재료와 열을 생각해 선택하세요. 급하게 식히면 강해지지만 균열 위험이 있습니다.</p><div class="choicegrid"><button class="choice" data-q="fast"><b>차가운 물</b><br><small>+8 품질 · 균열 위험</small></button><button class="choice" data-q="oil"><b>기름</b><br><small>+5 품질 · 안정적</small></button><button class="choice" data-q="slow"><b>천천히 식히기</b><br><small>+2 품질 · 안전</small></button></div>');document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{state.quality+=b.dataset.q==="fast"?8:b.dataset.q==="oil"?5:2;if(b.dataset.q==="fast"&&Math.random()<.18)state.quality-=14;closeModal();state.phase="polish";render();polishModal()})}
function polishModal(){openModal('<div class="eyebrow">04 · FINISH</div><h2>칼날을 문질러라</h2><p>아래 영역을 좌우로 드래그해 표면의 거친 흔적을 없애세요. 3초 이상 꾸준히 움직이면 완성도가 올라갑니다.</p><div class="dragzone" id="dragzone">이곳을 좌우로 문지르세요</div><div class="progress"><i id="polishFill"></i></div><div class="mini"><button class="action primary" id="finishBtn">완성</button></div>');let active=false,last=0,total=0;const z=$("#dragzone"),p=$("#polishFill");const move=e=>{if(!active)return;const x=e.clientX??e.touches?.[0]?.clientX??0;if(Math.abs(x-last)>3){total+=Math.min(3,Math.abs(x-last)/10);last=x;p.style.width=Math.min(100,total*2.5)+"%"}};z.addEventListener("pointerdown",e=>{active=true;last=e.clientX;z.setPointerCapture(e.pointerId)});z.addEventListener("pointermove",move);z.addEventListener("pointerup",()=>active=false);$("#finishBtn").onclick=()=>{state.quality+=Math.min(25,total*0.5);closeModal();state.phase="result";render();resultModal()}}
function resultModal(){const r=recipes.find(x=>x.id===state.selectedRecipe);let q=Math.round(Math.min(99,Math.max(1,state.quality+35)));let grade=q>=90?"명작":q>=80?"우수":q>=70?"완성품":"미숙";let order=state.orders.find(o=>!o.done&&o.id===r.id)||state.orders[state.orderIndex];let bonus=Math.round(r.base*(q/100));let matched=order&&order.id===r.id&&q>=order.min;let reward=matched?order.reward+Math.max(0,bonus-r.base):bonus;state.gold+=reward;state.rep+=matched?2:q>=80?1:0;if(order&&matched)order.done=true;state.completed++;state.phase="idle";save();render();openModal('<div class="eyebrow">MASTERWORK COMPLETE</div><h2>'+grade+'</h2><p class="end">'+r.name+' · 품질 '+q+'</p><div class="loot"><span class="chip">판매가 +'+reward+' G</span><span class="chip">평판 '+(matched?"+2":"+0")+'</span></div><p>'+ (matched?"의뢰인이 만족스럽게 무기를 받아갔다.":"완성품을 진열대에 올렸다. 다음에는 의뢰 조건을 노려보자.")+'</p><button class="action primary" id="resultOk">작업대로</button>');$("#resultOk").onclick=()=>{closeModal();if(state.completed%3===0)storyEvent();render()}}
function storyEvent(){state.story++;if(state.day===3)toast("마을에 새 소문이 돌고 있습니다.");if(state.day===5)toast("성에서 수상한 주문이 들어왔습니다.");save()}
function showOrders(){openModal('<div class="eyebrow">TODAY'S ORDERS</div><h2>오늘의 의뢰</h2>'+state.orders.map(o=>'<div class="recipe '+(o.done?"done":"")+'"><h4>'+o.who+' · '+o.name+'</h4><p>품질 '+o.min+' 이상 · 보상 '+o.reward+' G</p></div>').join("")+'<button class="action" id="close1">닫기</button>');$("#close1").onclick=closeModal}
function showRecipes(){openModal('<div class="eyebrow">WORKSHOP</div><h2>제작대</h2><p>오른쪽 목록에서 무기를 선택하고 작업을 시작하세요. 제작은 재료를 실제로 소모합니다.</p><div class="choicegrid">'+recipes.map(r=>'<button class="choice" data-r2="'+r.id+'"><b>'+r.name+'</b><br><small>'+r.desc+'</small></button>').join("")+'</div>');document.querySelectorAll("[data-r2]").forEach(b=>b.onclick=()=>{state.selectedRecipe=b.dataset.r2;closeModal();render()})}
function showTown(){openModal('<div class="eyebrow">TOWN</div><h2>작은 마을</h2><p>하루의 남은 시간 동안 무엇을 할까요?</p><div class="choicegrid"><button class="choice" id="mine"><b>광산에 투자</b><br><small>30 G · 철 +3, 석탄 +4</small></button><button class="choice" id="market"><b>시장 거래</b><br><small>50 G · 은 +1, 가죽 +2</small></button><button class="choice" id="rumor"><b>선술집 소문</b><br><small>무료 · 다음 날 사건 단서 획득</small></button></div>');$("#mine").onclick=()=>{if(state.gold>=30){state.gold-=30;state.inventory.iron+=3;state.inventory.coal+=4;toast("광산에서 재료를 들여왔습니다.");closeModal();render()}};$("#market").onclick=()=>{if(state.gold>=50){state.gold-=50;state.inventory.silver++;state.inventory.leather+=2;toast("시장 거래 완료.");closeModal();render()}};$("#rumor").onclick=()=>{state.story++;toast("새로운 소문을 들었습니다.");closeModal();save()}}
function endDay(){if(state.phase!=="idle"){toast("작업을 먼저 끝내세요.");return}if(state.day>=7){ending();return}const done=state.orders.filter(o=>o.done).length;state.gold+=done*10;state.day++;state.inventory.coal+=3;state.inventory.iron+=2;makeOrders();state.story+=done?1:0;save();render();toast("새로운 아침이 밝았습니다.");if(state.day===7)toast("마지막 의뢰가 도착했습니다.")}
function ending(){let title=state.rep>=9?"왕실 대장장이":state.gold>=600?"마을 최고의 장인":"불씨를 지킨 대장장이";openModal('<div class="eyebrow">DAY 7 · EPILOGUE</div><h2>'+title+'</h2><p class="end">7일 동안 '+state.completed+'개의 무기를 만들고 '+state.gold+' G를 벌었습니다.</p><p>당신이 만든 칼날은 단순한 쇠붙이가 아니라, 이 작은 마을의 내일을 지탱하는 약속이 되었습니다.</p><button class="action primary" id="restart">새로운 장인으로</button>');$("#restart").onclick=()=>{localStorage.removeItem("ember-steel-v3");location.reload()}}
$("#workBtn").onclick=startWork;$("#orderBtn").onclick=showOrders;$("#recipeBtn").onclick=showRecipes;$("#townBtn").onclick=showTown;$("#dayBtn").onclick=endDay;$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});document.addEventListener("keydown",e=>{if(e.code==="Space"&&state.phase==="heat"){e.preventDefault();$("#heatStop")?.click()}});
load();if(!state.orders?.length)makeOrders();render();
})();
</script>
</body></html>
