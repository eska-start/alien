<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#111111" />
<title>숨은 꼬물이 찾기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #111; color: #fff; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  video, canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; }
  canvas#c { touch-action: none; }
  #hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
  .pill { background: rgba(0,0,0,.55); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 16px; }
  #hint { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); pointer-events: auto; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; background: rgba(17,17,17,.88); }
  #toast { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 52px); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: rgba(0,0,0,.7); color: #f7c66b; font-size: 13px; padding: 8px 14px; border-radius: 12px; pointer-events: none; }
  #overlay.hidden, #hud.hidden, #hint.hidden, #toast.hidden { display: none; }
  h1 { font-size: 30px; letter-spacing: -1px; }
  p { font-size: 15px; line-height: 1.6; max-width: 320px; color: #ddd; }
  #result { font-size: 20px; font-weight: 800; min-height: 26px; }
  button { font: inherit; font-weight: 800; font-size: 17px; color: #111; background: #9be37a; border: 0; border-radius: 999px; padding: 14px 32px; cursor: pointer; }
  button.ghost { background: rgba(255,255,255,.9); font-size: 15px; padding: 10px 20px; }
  button:active { transform: scale(.96); }
  #hint:active { transform: translateX(-50%) scale(.96); }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><span class="pill" id="count">0 / 5</span><span class="pill" id="time">0.0초</span></div>
<div id="toast" class="hidden"></div>
<button id="hint" class="ghost hidden">힌트 (+10초)</button>
<div id="overlay">
  <h1>숨은 꼬물이 찾기</h1>
  <div id="result"></div>
  <p>주변에 꼬물이 5마리가 숨어 있어요.<br>꼬물이는 뒤에 있는 색으로 몸을 바꿉니다.<br>휴대폰을 돌려 둘러보고, 깜빡이는 눈을 찾아 탭하세요!</p>
  <button id="start">카메라 켜고 시작</button>
</div>
<script>
(() => {
  const TOTAL = 5, FOV = 55, HINT_PENALTY = 10;
  const REVEAL = ['#ff7aa8', '#ffd25a', '#7ad3ff', '#b48cff', '#7be08a'];
  const video = document.getElementById('v');
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const sample = document.createElement('canvas'), sctx = sample.getContext('2d', { willReadFrequently: true });
  const $ = id => document.getElementById(id);
  const overlay = $('overlay'), hud = $('hud'), hintBtn = $('hint');

  let W = 0, H = 0, ppd = 1, K = 8;
  let source = null, srcW = 0, srcH = 0;         // 카메라 또는 대체 배경
  let yaw = 0, pitch = 0, gyro = false;          // 바라보는 방향(도)
  let chars = [], found = 0, t0 = 0, penalty = 0, running = false, hintUntil = 0, endAt = 0;
  let pixels = null, ripples = [], lastT = 0;
  let best = 0;
  try { best = +localStorage.getItem('hide-best') || 0; } catch (e) {}

  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    ppd = W / FOV;
    sample.width = Math.ceil(W / K); sample.height = Math.ceil(H / K);
  }
  addEventListener('resize', resize);

  // 카메라가 없을 때 쓸 얼룩무늬 배경 (둘러보면 함께 움직임)
  function makeFallback() {
    const c = document.createElement('canvas'); c.width = 1600; c.height = 900;
    const g = c.getContext('2d');
    g.fillStyle = '#6b8f5a'; g.fillRect(0, 0, c.width, c.height);
    const cols = ['#4f7a43', '#8fb36b', '#a58c5a', '#3e5e36', '#c7b37a', '#7aa0b8'];
    for (let i = 0; i < 260; i++) {
      g.fillStyle = cols[i % cols.length]; g.globalAlpha = .55;
      g.beginPath(); g.ellipse(Math.random() * c.width, Math.random() * c.height, 20 + Math.random() * 90, 20 + Math.random() * 70, Math.random() * 3, 0, 7); g.fill();
    }
    return c;
  }
  const fallback = makeFallback();

  async function startCamera() {
    if (source === video) return true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream; await video.play();
      source = video; return true;
    } catch (e) {
      source = fallback; return false;
    }
  }

  async function startMotion() {
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        if (await DeviceMotionEvent.requestPermission() !== 'granted') return;
      }
    } catch (e) { return; }
    addEventListener('devicemotion', onMotion);
  }
  let lastMotion = 0;
  function onMotion(e) {
    const r = e.rotationRate; if (!r || r.beta == null) return;
    const now = performance.now(), dt = lastMotion ? Math.min((now - lastMotion) / 1000, .1) : 0; lastMotion = now;
    if (!dt) return;
    gyro = true;
    // 세로로 든 휴대폰 기준: y축 회전 = 좌우, x축 회전 = 위아래
    yaw -= (r.gamma || 0) * dt;
    pitch = clamp(pitch + (r.beta || 0) * dt, -60, 60);
  }

  // 손가락/마우스로 둘러보기 (센서가 없거나 보조용)
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }; });
  cv.addEventListener('pointermove', e => {
    if (!drag || !running) return;
    yaw -= (e.clientX - drag.x) / ppd; pitch = clamp(pitch + (e.clientY - drag.y) / ppd, -60, 60);
    drag.x = e.clientX; drag.y = e.clientY;
  });
  cv.addEventListener('pointerup', e => {
    if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 10) tap(e.clientX, e.clientY);
    drag = null;
  });

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap = a => ((a + 540) % 360) - 180;

  function placeChars() {
    chars = [];
    while (chars.length < TOTAL) {
      const c = { yaw: yaw + (Math.random() * 240 - 120), pitch: pitch + (Math.random() * 50 - 25) };
      if (chars.some(o => Math.hypot(wrap(o.yaw - c.yaw), o.pitch - c.pitch) < 28)) continue;
      if (Math.abs(wrap(c.yaw - yaw)) < 18) continue; // 시작하자마자 정면에 있지 않게
      Object.assign(c, {
        r: 18 + Math.random() * 10, rot: (Math.random() - .5) * 1.2, flip: Math.random() < .5,
        blink: 1.5 + Math.random() * 3, open: 0, found: 0, color: REVEAL[chars.length],
        tone: [128, 128, 128], shade: (Math.random() - .5) * 20
      });
      chars.push(c);
    }
  }

  function screenPos(c) {
    return { x: W / 2 + wrap(c.yaw - yaw) * ppd, y: H / 2 - (c.pitch - pitch) * ppd };
  }

  // 소스 화면을 object-fit: cover 와 같은 방식으로 그림
  function drawCover(g, w, h) {
    if (source === video) {
      srcW = video.videoWidth; srcH = video.videoHeight; if (!srcW) return false;
      const s = Math.max(w / srcW, h / srcH);
      g.drawImage(video, (w - srcW * s) / 2, (h - srcH * s) / 2, srcW * s, srcH * s);
    } else {
      // 대체 배경은 360°를 한 바퀴로 감싸고, 바라보는 방향에 맞춰 스크롤
      const f = w / W, tw = 360 * ppd * f, th = tw * fallback.height / fallback.width;
      let ox = (w / 2 - (yaw + 180) * ppd * f) % tw; if (ox > 0) ox -= tw;
      const oy = (h - th) / 2 + pitch * ppd * f;
      for (let x = ox; x < w; x += tw) g.drawImage(fallback, x, oy, tw, th);
    }
    return true;
  }

  function colorAt(x, y) {
    if (!pixels) return [128, 128, 128];
    const sx = clamp(Math.round(x / K), 0, sample.width - 1), sy = clamp(Math.round(y / K), 0, sample.height - 1);
    let r = 0, g = 0, b = 0, n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const px = clamp(sx + dx, 0, sample.width - 1), py = clamp(sy + dy, 0, sample.height - 1);
      const i = (py * sample.width + px) * 4; r += pixels[i]; g += pixels[i + 1]; b += pixels[i + 2]; n++;
    }
    return [r / n, g / n, b / n];
  }

  function tap(x, y) {
    if (!running) return;
    for (const c of chars) {
      if (c.found) continue;
      const p = screenPos(c);
      if (Math.hypot(p.x - x, p.y - y) < c.r * 1.6 + 14) {
        c.found = 0.001; found++; updateHud();
        if (navigator.vibrate) navigator.vibrate(40);
        if (found >= TOTAL) finish();
        return;
      }
    }
    ripples.push({ x, y, t: 0 });
  }

  function elapsed() { return (performance.now() - t0) / 1000 + penalty; }
  function updateHud() { $('count').textContent = found + ' / ' + TOTAL; }

  function finish() {
    running = false; endAt = performance.now();
    const t = elapsed();
    let msg = t.toFixed(1) + '초 만에 다 찾았어요!';
    if (!best || t < best) { best = t; try { localStorage.setItem('hide-best', best.toFixed(1)); } catch (e) {} msg += ' 🏆 신기록'; }
    else msg += ' (최고 ' + (+best).toFixed(1) + '초)';
    setTimeout(() => {
      $('result').textContent = msg; $('start').textContent = '다시 하기';
      hud.classList.add('hidden'); hintBtn.classList.add('hidden'); overlay.classList.remove('hidden');
    }, 1400);
  }

  hintBtn.addEventListener('click', () => { if (running) { penalty += HINT_PENALTY; hintUntil = performance.now() + 2500; } });

  $('start').addEventListener('click', async () => {
    $('start').disabled = true;
    const [camOk] = await Promise.all([startCamera(), startMotion()]);
    $('start').disabled = false;
    const toast = $('toast');
    toast.textContent = !camOk ? '카메라를 쓸 수 없어 연습용 배경으로 진행해요. 드래그해서 둘러보세요.' : '휴대폰을 천천히 돌려 둘러보세요. 드래그해도 돼요.';
    toast.classList.remove('hidden'); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.add('hidden'), 4000);
    yaw = 0; pitch = 0; placeChars(); found = 0; penalty = 0; hintUntil = 0; ripples = [];
    updateHud(); t0 = performance.now(); running = true;
    overlay.classList.add('hidden'); hud.classList.remove('hidden'); hintBtn.classList.remove('hidden');
  });

  // 꼬물이: 동그란 몸, 말린 꼬리, 툭 튀어나온 눈
  function drawChar(c, x, y, fill, alpha, eyesOpen, glow) {
    const r = c.r;
    ctx.save(); ctx.translate(x, y); ctx.rotate(c.rot); if (c.flip) ctx.scale(-1, 1);
    ctx.globalAlpha = alpha;
    if (glow) { ctx.shadowColor = '#fff'; ctx.shadowBlur = glow; }
    ctx.fillStyle = fill; ctx.strokeStyle = fill; ctx.lineCap = 'round';
    // 꼬리
    ctx.lineWidth = r * .32;
    ctx.beginPath(); ctx.moveTo(-r * .8, r * .2);
    ctx.quadraticCurveTo(-r * 1.6, r * .3, -r * 1.5, -r * .2);
    ctx.arc(-r * 1.2, -r * .2, r * .3, Math.PI, Math.PI * 2.6); ctx.stroke();
    // 다리
    ctx.lineWidth = r * .22;
    for (const lx of [-.45, .45]) { ctx.beginPath(); ctx.moveTo(r * lx, r * .6); ctx.lineTo(r * lx * 1.2, r * 1.05); ctx.stroke(); }
    // 몸통
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * .78, 0, 0, Math.PI * 2); ctx.fill();
    // 눈 언덕
    ctx.beginPath(); ctx.arc(r * .45, -r * .55, r * .42, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    // 눈
    if (eyesOpen > 0) {
      ctx.globalAlpha = alpha * eyesOpen;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(r * .5, -r * .58, r * .25, r * .25 * eyesOpen, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.arc(r * .58, -r * .58, r * .11, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha = alpha * .35; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(r * .3, -r * .58); ctx.lineTo(r * .7, -r * .58); ctx.stroke();
    }
    ctx.restore();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = lastT ? Math.min((now - lastT) / 1000, .05) : 0; lastT = now;
    ctx.clearRect(0, 0, W, H);
    if (!source) return;

    // 대체 배경은 화면에도 그림 (카메라일 땐 video 요소가 보임)
    if (source !== video) drawCover(ctx, W, H);
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    if (drawCover(sctx, sample.width, sample.height)) pixels = sctx.getImageData(0, 0, sample.width, sample.height).data;

    for (const c of chars) {
      const p = screenPos(c);
      if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) continue;
      if (c.found) {
        c.found = Math.min(c.found + dt * 2.5, 1);
        const s = 1 + Math.sin(c.found * Math.PI) * .5;
        ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s); ctx.translate(-p.x, -p.y);
        drawChar(c, p.x, p.y, c.color, 1, 1, 14);
        ctx.restore();
        continue;
      }
      // 등 뒤 색을 따라 천천히 변색
      const bg = colorAt(p.x, p.y);
      for (let i = 0; i < 3; i++) c.tone[i] += (bg[i] + c.shade - c.tone[i]) * Math.min(1, dt * 6);
      // 깜빡임: 가끔 눈을 뜸
      c.blink -= dt;
      if (c.blink <= 0) { c.open = 0.9; c.blink = 2 + Math.random() * 3.5; }
      c.open = Math.max(0, c.open - dt);
      const eyes = c.open > 0 ? Math.min(1, c.open * 4, (0.9 - c.open) * 6 + .2) : 0;
      const wob = Math.sin(now / 400 + c.r) * 1.2;
      const fill = `rgb(${c.tone.map(v => clamp(v | 0, 0, 255)).join(',')})`;
      const glow = now < hintUntil && c === nearest() ? 18 + Math.sin(now / 80) * 8 : 0;
      drawChar(c, p.x, p.y + wob, fill, .93, eyes, glow);
    }

    // 힌트 화살표
    if (running && now < hintUntil) {
      const c = nearest();
      if (c) {
        const a = Math.atan2(-(c.pitch - pitch), wrap(c.yaw - yaw));
        ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(a);
        ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(70, 0); ctx.lineTo(40, -16); ctx.lineTo(40, 16); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    }

    // 빗나간 탭 표시
    ripples = ripples.filter(r => (r.t += dt) < .4);
    for (const r of ripples) {
      ctx.strokeStyle = `rgba(255,255,255,${.8 - r.t * 2})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(r.x, r.y, 10 + r.t * 60, 0, Math.PI * 2); ctx.stroke();
    }

    if (running) $('time').textContent = elapsed().toFixed(1) + '초';
  }

  function nearest() {
    let bestC = null, bd = 1e9;
    for (const c of chars) {
      if (c.found) continue;
      const d = Math.hypot(wrap(c.yaw - yaw), c.pitch - pitch);
      if (d < bd) { bd = d; bestC = c; }
    }
    return bestC;
  }

  resize();
  requestAnimationFrame(frame);
  window.__hide = { get chars() { return chars; }, screenPos, get yaw() { return yaw; }, set yaw(v) { yaw = v; }, get pitch() { return pitch; }, set pitch(v) { pitch = v; } };
})();
</script>
</body>
</html>
