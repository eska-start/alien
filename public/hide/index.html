<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#111111" />
<title>숨은 꼬물이 찾기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #111; color: #fff; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  video, canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; }
  video { object-fit: cover; }
  canvas#c { touch-action: none; }
  .hidden { display: none !important; }
  #hud { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; padding: 0 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
  .pill { background: rgba(0,0,0,.55); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 15px; white-space: nowrap; }
  #radar { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 48px); left: 50%; transform: translateX(-50%); pointer-events: none; transition: background .2s; }
  #toast { position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 96px); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px); background: rgba(0,0,0,.7); color: #f7c66b; font-size: 13px; padding: 8px 14px; border-radius: 12px; pointer-events: none; text-align: center; }
  #bottom { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; justify-content: center; gap: 10px; }
  #banner { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; pointer-events: none; text-align: center; padding: 24px; background: rgba(0,0,0,.45); }
  #banner b { font-size: 30px; letter-spacing: -1px; }
  #banner span { font-size: 16px; color: #eee; }
  #overlay { position: fixed; inset: 0; overflow-y: auto; background: rgba(17,17,17,.92); }
  #overlay .in { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px 16px; text-align: center; }
  h1 { font-size: 30px; letter-spacing: -1px; }
  p { font-size: 15px; line-height: 1.65; max-width: 330px; color: #ddd; }
  #result { font-size: 20px; font-weight: 800; }
  #gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: min(100%, 420px); }
  #gallery figure { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #ccc; }
  #gallery canvas { width: 100%; aspect-ratio: 1; border-radius: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-weight: 800; font-size: 17px; color: #111; background: #9be37a; border: 0; border-radius: 999px; padding: 14px 30px; cursor: pointer; }
  button.ghost { background: rgba(255,255,255,.9); font-size: 15px; padding: 10px 18px; }
  button:active { transform: scale(.96); }
</style>
</head>
<body>
<video id="v" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><span class="pill" id="stage">1단계</span><span class="pill" id="count">0 / 3</span><span class="pill" id="time">0.0초</span></div>
<div id="radar" class="pill hidden">🧊 차가워요</div>
<div id="toast" class="hidden"></div>
<div id="bottom" class="hidden"><button id="sound" class="ghost">🔊</button><button id="hint" class="ghost">🔍 힌트</button></div>
<div id="banner" class="hidden"><b id="bannerTitle"></b><span id="bannerSub"></span></div>
<div id="overlay"><div class="in">
  <h1>숨은 꼬물이 찾기</h1>
  <div id="result" class="hidden"></div>
  <div id="gallery" class="hidden"></div>
  <p id="intro">카멜레온 옷을 입은 꼬물이들이 숨었어요!<br>꼬물이는 뒤에 있는 색으로 옷 색을 바꿔요.<br>휴대폰을 돌려 둘러보고, <b>반짝이는 눈</b>과 <b>손 흔드는 친구</b>를 찾아 탭하세요.<br><br>🔍 힌트는 공짜! 못 찾으면 화살표가 도와줘요<br>✨ 황금 꼬물이를 찾으면 −5초</p>
  <div class="row">
    <button id="save" class="ghost hidden">📸 기념사진 저장</button>
    <button id="start">카메라 켜고 시작</button>
  </div>
</div></div>
<script>
(() => {
  const FOV = 55, HINT_COOLDOWN = 5, AUTO_HINT = 15, GOLD_BONUS = 5, COMBO_BONUS = 2, COMBO_WINDOW = 4;
  const STAGES = [
    { n: 3, title: '1단계 · 꼬물이 3명', sub: '눈이 반짝! 손을 흔드는 친구를 찾아 탭!' },
    { n: 4, title: '2단계 · 꼬물이 4명', sub: '감지기가 🔥 바로 여기! 하면 주변을 잘 봐요' },
    { n: 5, title: '3단계 · 꼬물이 5명', sub: '마지막 단계! 모두 찾아 주세요' },
  ];
  const REVEAL = ['#ff7aa8', '#7ad3ff', '#b48cff', '#7be08a', '#ff9f5a', '#5ae0d2'];
  const ADJ = ['말랑한', '졸린', '배고픈', '수줍은', '용감한', '꼬질한', '통통한', '새침한', '느긋한', '장난꾸러기', '방귀쟁이', '잠꾸러기'];
  const video = document.getElementById('v');
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  const sample = document.createElement('canvas'), sctx = sample.getContext('2d', { willReadFrequently: true });
  const $ = id => document.getElementById(id);

  let W = 0, H = 0, ppd = 1; const K = 8;
  let source = null;
  let yaw = 0, pitch = 0;
  let mode = 'menu';          // menu | play | between
  let stage = 0, chars = [], found = 0, needed = 0;
  let active = 0, penalty = 0, bonus = 0, hintUntil = 0, hintReady = 0, lastFind = -99, lastProgress = 0, radarT = 0, animNow = 0;
  let pixels = null, fx = [], photos = [], lastT = 0;
  let best = 0;
  try { best = +localStorage.getItem('hide-best3') || 0; } catch (e) {}

  /* ---------- 화면 ---------- */
  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    ppd = W / FOV;
    sample.width = Math.ceil(W / K); sample.height = Math.ceil(H / K);
  }
  addEventListener('resize', resize);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const wrap = a => ((a % 360) + 540) % 360 - 180;
  const rand = (a, b) => a + Math.random() * (b - a);

  /* ---------- 소리 ---------- */
  let ac = null, soundOn = true;
  try { soundOn = localStorage.getItem('hide-sound') !== 'off'; } catch (e) {}
  function tone(freq, dur = .08, type = 'sine', vol = .15, slide = 0, delay = 0) {
    if (!ac || !soundOn) return;
    const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(freq * slide, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);
  }
  const sfx = {
    found: () => { tone(660, .1, 'triangle'); tone(880, .1, 'triangle', .15, 0, .08); tone(1320, .18, 'triangle', .12, 0, .16); },
    gold: () => [784, 988, 1175, 1568, 1976].forEach((f, i) => tone(f, .14, 'triangle', .12, 0, i * .06)),
    miss: () => tone(180, .12, 'square', .05),
    stage: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .16, 'square', .06, 0, i * .1)),
    win: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .12, 0, i * .12)),
    tick: () => tone(1400, .03, 'sine', .04),
  };
  function updateSoundBtn() { $('sound').textContent = soundOn ? '🔊' : '🔇'; }
  $('sound').addEventListener('click', () => {
    soundOn = !soundOn; updateSoundBtn();
    try { localStorage.setItem('hide-sound', soundOn ? 'on' : 'off'); } catch (e) {}
  });
  updateSoundBtn();

  /* ---------- 카메라 / 대체 배경 ---------- */
  function makeFallback() {
    const c = document.createElement('canvas'); c.width = 1600; c.height = 900;
    const g = c.getContext('2d');
    g.fillStyle = '#6b8f5a'; g.fillRect(0, 0, c.width, c.height);
    const cols = ['#4f7a43', '#8fb36b', '#a58c5a', '#3e5e36', '#c7b37a', '#7aa0b8'];
    for (let i = 0; i < 260; i++) {
      g.fillStyle = cols[i % cols.length]; g.globalAlpha = .55;
      g.beginPath(); g.ellipse(Math.random() * c.width, Math.random() * c.height, rand(20, 110), rand(20, 90), Math.random() * 3, 0, 7); g.fill();
    }
    return c;
  }
  const fallback = makeFallback();

  async function startCamera() {
    if (source === video) return true;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false });
      video.srcObject = stream; await video.play();
      source = video; return true;
    } catch (e) { source = fallback; return false; }
  }

  // object-fit: cover 와 같은 방식으로 소스를 (w × h) 영역에 그림
  function drawCover(g, w, h) {
    if (source === video) {
      const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return false;
      const s = Math.max(w / vw, h / vh);
      g.drawImage(video, (w - vw * s) / 2, (h - vh * s) / 2, vw * s, vh * s);
    } else if (source) {
      const f = w / W, tw = 360 * ppd * f, th = tw * fallback.height / fallback.width;
      let ox = (w / 2 - (yaw + 180) * ppd * f) % tw; if (ox > 0) ox -= tw;
      const oy = (h - th) / 2 + pitch * ppd * f;
      for (let x = ox; x < w; x += tw) g.drawImage(fallback, x, oy, tw, th);
    } else return false;
    return true;
  }

  /* ---------- 방향 센서 ---------- */
  let motionOn = false, lastMotion = 0;
  async function startMotion() {
    if (motionOn) return;
    try {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        if (await DeviceMotionEvent.requestPermission() !== 'granted') return;
      }
    } catch (e) { return; }
    motionOn = true;
    addEventListener('devicemotion', e => {
      const r = e.rotationRate; if (!r || r.beta == null) return;
      const now = performance.now(), dt = lastMotion ? Math.min((now - lastMotion) / 1000, .1) : 0; lastMotion = now;
      if (!dt) return;
      // 세로로 든 휴대폰: y축 회전 = 좌우, x축 회전 = 위아래
      yaw -= (r.gamma || 0) * dt;
      pitch = clamp(pitch + (r.beta || 0) * dt, -60, 60);
    });
  }

  /* ---------- 입력 ---------- */
  let drag = null;
  cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY }; });
  cv.addEventListener('pointermove', e => {
    if (!drag || mode === 'menu') return;
    yaw -= (e.clientX - drag.x) / ppd; pitch = clamp(pitch + (e.clientY - drag.y) / ppd, -60, 60);
    drag.x = e.clientX; drag.y = e.clientY;
  });
  cv.addEventListener('pointerup', e => {
    if (drag && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 10) tap(e.clientX, e.clientY);
    drag = null;
  });
  function showHint() { hintUntil = performance.now() + 3000; }
  $('hint').addEventListener('click', () => {
    if (mode !== 'play' || active < hintReady) return;
    showHint(); hintReady = active + HINT_COOLDOWN;
  });

  /* ---------- 꼬물이 배치 ---------- */
  function newChar(kind, i) {
    const others = chars.filter(c => !c.found);
    for (let tries = 0; tries < 300; tries++) {
      const c = { yaw: yaw + rand(-100, 100), pitch: clamp(pitch + rand(-18, 18), -45, 45) };
      if (tries < 250 && others.some(o => Math.hypot(wrap(o.yaw - c.yaw), o.pitch - c.pitch) < 30)) continue;
      if (Math.abs(wrap(c.yaw - yaw)) < 20) continue;  // 시작하자마자 눈앞에 있지 않게
      return Object.assign(c, {
        kind, r: kind === 'gold' ? rand(22, 26) : rand(26, 34), flip: Math.random() < .5, phase: rand(0, 6),
        blink: rand(1, 3), open: 0, wave: 0, waveCD: rand(1, 4), found: 0,
        color: kind === 'gold' ? '#ffd23f' : REVEAL[i % REVEAL.length],
        tone: null, shade: (Math.random() < .5 ? -1 : 1) * rand(28, 40),
        name: kind === 'gold' ? '황금 꼬물이' : ADJ[Math.random() * ADJ.length | 0] + ' 꼬물이',
      });
    }
    return null;
  }

  function startStage(i) {
    stage = i; const S = STAGES[i];
    chars = []; found = 0; needed = S.n; hintUntil = 0;
    for (let k = 0; k < S.n; k++) { const c = newChar('normal', k); if (c) chars.push(c); }
    needed = chars.length;
    const gold = Math.random() < .6;
    if (gold) { const g = newChar('gold', 0); if (g) chars.push(g); }
    $('stage').textContent = (i + 1) + '단계';
    updateCount();
    mode = 'between';
    $('bannerTitle').textContent = S.title; $('bannerSub').textContent = S.sub;
    $('banner').classList.remove('hidden');
    sfx.stage();
    setTimeout(() => {
      $('banner').classList.add('hidden'); mode = 'play'; lastProgress = active;
      if (gold) toast('✨ 황금 꼬물이가 어딘가에… (찾으면 −' + GOLD_BONUS + '초)');
    }, 2200);
  }

  function updateCount() { $('count').textContent = found + ' / ' + needed; }

  function toast(msg, ms = 3200) {
    const t = $('toast'); t.textContent = msg; t.classList.remove('hidden');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.add('hidden'), ms);
  }

  function screenPos(c) { return { x: W / 2 + wrap(c.yaw - yaw) * ppd, y: H / 2 - (c.pitch - pitch) * ppd }; }

  /* ---------- 탭 ---------- */
  function tap(x, y) {
    if (mode !== 'play') return;
    let hit = null, hd = 1e9;
    for (const c of chars) {
      if (c.found) continue;
      // 사람 모양 전체(머리~발)를 넉넉하게 덮는 타원
      const p = screenPos(c), dx = (p.x - x) / (c.r * 1.3 + 20), dy = (p.y - c.r * .6 - y) / (c.r * 2 + 20), d = dx * dx + dy * dy;
      if (d < 1 && d < hd) { hit = c; hd = d; }
    }
    if (!hit) { fx.push({ type: 'ring', x, y, t: 0 }); sfx.miss(); return; }
    catchChar(hit);
  }

  function catchChar(c) {
    c.found = .001;
    const p = screenPos(c);
    photos.push(snapshot(c, p));
    confetti(p.x, p.y, c.color);
    if (navigator.vibrate) navigator.vibrate(c.kind === 'gold' ? [40, 40, 40] : 40);
    floatText(p.x, p.y - c.r - 18, c.name, '#fff');
    if (c.kind === 'gold') {
      bonus += GOLD_BONUS; sfx.gold();
      floatText(p.x, p.y - c.r - 42, '−' + GOLD_BONUS + '초 ✨', '#ffd23f');
      return;
    }
    sfx.found();
    const now = active;
    if (now - lastFind < COMBO_WINDOW) {
      bonus += COMBO_BONUS;
      floatText(p.x, p.y - c.r - 42, '콤보! −' + COMBO_BONUS + '초', '#9be37a');
    }
    lastFind = now; lastProgress = active;
    found++; updateCount();
    if (found >= needed) {
      for (const g of chars) if (!g.found && g.kind === 'gold') g.gone = true;
      mode = 'between';
      setTimeout(() => stage + 1 < STAGES.length ? startStage(stage + 1) : finish(), 1200);
    }
  }

  /* ---------- 효과 ---------- */
  function confetti(x, y, color) {
    const cols = [color, '#fff', '#ffd23f', '#ff7aa8', '#7ad3ff'];
    for (let i = 0; i < 26; i++) {
      const a = rand(0, Math.PI * 2), s = rand(80, 320);
      fx.push({ type: 'bit', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120, t: 0, life: rand(.6, 1.1), color: cols[i % cols.length], rot: rand(0, 6) });
    }
  }
  function floatText(x, y, text, color) { fx.push({ type: 'text', x, y, text, color, t: 0, life: 1.3 }); }

  /* ---------- 기념사진 ---------- */
  function snapshot(c, p) {
    const S = 240, z = 165 / (c.r * 3.6), cy = p.y - c.r * .6, cnv = document.createElement('canvas'); cnv.width = cnv.height = S;
    const g = cnv.getContext('2d');
    g.fillStyle = '#222'; g.fillRect(0, 0, S, S);
    g.save(); g.translate(S / 2 - p.x * z, S / 2 - 12 - cy * z); g.scale(z, z); drawCover(g, W, H); g.restore();
    g.save(); g.translate(S / 2, S / 2 - 12 + c.r * .6 * z); g.scale(z, z);
    drawChar(g, c, 0, 0, c.color, 1, 1, 10, true);
    g.restore();
    g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, S - 30, S, 30);
    g.fillStyle = '#fff'; g.font = 'bold 15px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(c.name, S / 2, S - 15);
    cnv.dataset.name = c.name;
    return cnv;
  }

  function showGallery() {
    const gal = $('gallery'); gal.innerHTML = '';
    for (const ph of photos) {
      const f = document.createElement('figure'); f.appendChild(ph);
      gal.appendChild(f);
    }
    gal.classList.toggle('hidden', !photos.length);
    $('save').classList.toggle('hidden', !photos.length);
  }

  let lastResult = '';
  $('save').addEventListener('click', async () => {
    const cols = 4, S = 240, gap = 10, rows = Math.ceil(photos.length / cols);
    const out = document.createElement('canvas');
    out.width = cols * S + (cols + 1) * gap; out.height = rows * S + (rows + 1) * gap + 70;
    const g = out.getContext('2d');
    g.fillStyle = '#1b1b1b'; g.fillRect(0, 0, out.width, out.height);
    g.fillStyle = '#fff'; g.font = 'bold 30px system-ui, sans-serif'; g.textAlign = 'center';
    g.fillText('숨은 꼬물이 찾기 · ' + lastResult, out.width / 2, 46);
    photos.forEach((ph, i) => g.drawImage(ph, gap + (i % cols) * (S + gap), 70 + gap + (i / cols | 0) * (S + gap)));
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    const file = new File([blob], 'kkomul.png', { type: 'image/png' });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: '숨은 꼬물이 찾기' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kkomul.png';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });

  /* ---------- 시작 / 끝 ---------- */
  // 보너스로 줄일 수 있는 건 실제 걸린 시간의 70%까지
  function total() { return Math.max(active * .3, active + penalty - bonus); }

  $('start').addEventListener('click', async () => {
    try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {}
    $('start').disabled = true;
    const [camOk] = await Promise.all([startCamera(), startMotion()]);
    $('start').disabled = false;
    yaw = 0; pitch = 0; active = 0; penalty = 0; bonus = 0; lastFind = -99; hintReady = 0; photos = []; fx = [];
    ['overlay'].forEach(id => $(id).classList.add('hidden'));
    ['hud', 'radar', 'bottom'].forEach(id => $(id).classList.remove('hidden'));
    startStage(0);
    setTimeout(() => toast(camOk ? '휴대폰을 천천히 돌려 둘러보세요. 드래그해도 돼요.' : '카메라를 쓸 수 없어 연습용 배경으로 진행해요. 드래그해서 둘러보세요.', 3500), 2300);
  });

  function finish() {
    mode = 'menu'; sfx.win();
    const t = total();
    lastResult = t.toFixed(1) + '초';
    let msg = '🎉 ' + t.toFixed(1) + '초 만에 모두 찾았어요!';
    if (!best || t < best) { best = t; try { localStorage.setItem('hide-best3', t.toFixed(1)); } catch (e) {} msg += '\n🏆 신기록!'; }
    else msg += '\n최고 기록 ' + (+best).toFixed(1) + '초';
    const golds = photos.filter(p => p.dataset.name === '황금 꼬물이').length;
    if (golds) msg += ' · 황금 ' + golds + '마리';
    setTimeout(() => {
      $('result').textContent = msg; $('result').style.whiteSpace = 'pre-line'; $('result').classList.remove('hidden');
      $('intro').classList.add('hidden'); showGallery();
      $('start').textContent = '다시 하기';
      ['hud', 'radar', 'bottom', 'toast'].forEach(id => $(id).classList.add('hidden'));
      $('overlay').classList.remove('hidden'); $('overlay').scrollTop = 0;
    }, 1500);
  }

  /* ---------- 그리기 ---------- */
  function colorAt(x, y) {
    if (!pixels) return [128, 128, 128];
    const sx = clamp(Math.round(x / K), 0, sample.width - 1), sy = clamp(Math.round(y / K), 0, sample.height - 1);
    let r = 0, g = 0, b = 0, n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const px = clamp(sx + dx, 0, sample.width - 1), py = clamp(sy + dy, 0, sample.height - 1);
      const i = (py * sample.width + px) * 4; r += pixels[i]; g += pixels[i + 1]; b += pixels[i + 2]; n++;
    }
    return [r / n, g / n, b / n];
  }

  // 꼬물이: 카멜레온 옷을 입은 꼬마 (볏 모자, 말린 꼬리, 큰 눈)
  // (x, y)는 허리 위치. 머리 꼭대기는 약 -2.4r, 발끝은 +1.2r
  function drawChar(g, c, x, y, fill, alpha, eyesOpen, glow, happy, line) {
    const r = c.r, t = animNow / 1000;
    line = line || 'rgba(0,0,0,.35)';
    g.save(); g.translate(x, y); if (c.flip) g.scale(-1, 1);
    g.globalAlpha = alpha; g.lineCap = g.lineJoin = 'round';
    const hop = happy ? -Math.abs(Math.sin(t * 7)) * r * .25 : 0;
    g.translate(0, hop);

    // 팔 각도(0 = 아래로, π = 위로)
    const waving = c.wave > 0;
    const aL = happy ? 2.6 + Math.sin(t * 9) * .2 : .35;
    const aR = happy ? 2.6 - Math.sin(t * 9) * .2 : waving ? 2.5 + Math.sin(t * 14) * .45 : .35;
    const arm = (side, a) => { const sx = side * r * .48, sy = -r * .72, L = r * .78; g.moveTo(sx, sy); g.lineTo(sx + side * Math.sin(a) * L, sy + Math.cos(a) * L); };
    const limbs = (w, col) => {
      g.strokeStyle = col; g.lineWidth = w; g.beginPath();
      g.moveTo(-r * .24, r * .3); g.lineTo(-r * .3, r * 1.15);           // 다리
      g.moveTo(r * .24, r * .3); g.lineTo(r * .3, r * 1.15);
      arm(-1, aL); arm(1, aR);                                           // 팔
      g.moveTo(-r * .35, r * .2);                                        // 말린 꼬리
      g.quadraticCurveTo(-r * 1.15, r * .45, -r * 1.1, r * .02);
      g.arc(-r * .84, r * .02, r * .26, Math.PI, Math.PI * 2.6);
      g.stroke();
    };
    const bodyPath = () => {
      g.beginPath();
      const x0 = -r * .55, x1 = r * .55, y0 = -r * .98, y1 = r * .45, k = r * .35;
      g.moveTo(x0 + k, y0); g.lineTo(x1 - k, y0); g.quadraticCurveTo(x1, y0, x1, y0 + k);
      g.lineTo(x1, y1 - k); g.quadraticCurveTo(x1, y1, x1 - k, y1); g.lineTo(x0 + k, y1);
      g.quadraticCurveTo(x0, y1, x0, y1 - k); g.lineTo(x0, y0 + k); g.quadraticCurveTo(x0, y0, x0 + k, y0);
    };
    const headPath = () => {
      g.beginPath(); g.arc(0, -r * 1.55, r * .62, 0, Math.PI * 2);
      g.moveTo(r * .42, -r * 2.05); g.arc(0, -r * 2.0, r * .42, -.15, Math.PI + .15, true);   // 카멜레온 볏 모자
    };

    if (glow) { g.shadowColor = c.kind === 'gold' ? '#ffd23f' : '#fff'; g.shadowBlur = glow; }
    // 외곽선 → 채우기 순서로 그려서 테두리가 보이게
    limbs(r * .34 + 4, line);
    g.lineWidth = 4; g.strokeStyle = line; bodyPath(); g.stroke(); headPath(); g.stroke();
    g.shadowBlur = 0;
    limbs(r * .34, fill);
    g.fillStyle = fill; bodyPath(); g.fill(); headPath(); g.fill();

    // 비늘 무늬
    g.fillStyle = 'rgba(0,0,0,.13)';
    for (const [dx, dy, s] of [[-.22, -.55, .13], [.2, -.3, .11], [-.1, .05, .12], [.25, .22, .09], [-.3, -1.95, .09], [.15, -2.12, .08]]) {
      g.beginPath(); g.arc(r * dx, r * dy, r * s, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,.18)';
    g.beginPath(); g.ellipse(-r * .2, -r * 1.8, r * .18, r * .1, -.5, 0, Math.PI * 2); g.fill();

    // 눈 (항상 크게, 눈동자가 이리저리)
    const look = happy ? 0 : Math.sin(t * 1.3 + c.phase) * r * .07;
    for (const ex of [-.25, .25]) {
      g.fillStyle = '#fff'; g.strokeStyle = 'rgba(0,0,0,.45)'; g.lineWidth = 1.5;
      g.beginPath(); g.ellipse(r * ex, -r * 1.58, r * .2, r * .22 * Math.max(.12, eyesOpen), 0, 0, Math.PI * 2); g.fill(); g.stroke();
      if (eyesOpen > .5) {
        g.fillStyle = '#111';
        g.beginPath(); g.arc(r * ex + look, -r * 1.55, r * .1, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#fff';
        g.beginPath(); g.arc(r * ex + look + r * .035, -r * 1.59, r * .035, 0, Math.PI * 2); g.fill();
      }
    }
    if (happy) {
      g.fillStyle = 'rgba(255,120,150,.45)';
      for (const ex of [-.4, .4]) { g.beginPath(); g.ellipse(r * ex, -r * 1.3, r * .1, r * .07, 0, 0, Math.PI * 2); g.fill(); }
      g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = Math.max(1.5, r * .07);
      g.beginPath(); g.arc(0, -r * 1.32, r * .16, .2, Math.PI - .2); g.stroke();
    } else {
      g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = Math.max(1.2, r * .05);
      g.beginPath(); g.arc(0, -r * 1.28, r * .08, .3, Math.PI - .3); g.stroke();
    }
    g.restore();
  }

  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));

  function nearest() {
    let b = null, bd = 1e9;
    for (const c of chars) {
      if (c.found || c.gone) continue;
      const d = Math.hypot(wrap(c.yaw - yaw), c.pitch - pitch);
      if (d < bd) { bd = d; b = c; }
    }
    return b ? { c: b, d: bd } : null;
  }

  function updateRadar(dt) {
    const n = nearest(), el = $('radar');
    if (!n) return;
    let label, bg, every;
    if (n.d < 9) { label = '🔥 바로 여기!'; bg = 'rgba(220,40,40,.8)'; every = .22; }
    else if (n.d < 22) { label = '♨️ 뜨거워요'; bg = 'rgba(230,110,30,.75)'; every = .45; }
    else if (n.d < 50) { label = '🙂 따뜻해요'; bg = 'rgba(200,160,30,.65)'; every = .9; }
    else { label = '🧊 차가워요'; bg = 'rgba(30,90,180,.6)'; every = 0; }
    if (el.textContent !== label) el.textContent = label;
    el.style.background = bg;
    radarT -= dt;
    if (every && radarT <= 0) { sfx.tick(); radarT = every; }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const dt = lastT ? Math.min((now - lastT) / 1000, .05) : 0; lastT = now;
    ctx.clearRect(0, 0, W, H);
    if (!source) return;
    if (mode === 'play') active += dt;

    if (source !== video) drawCover(ctx, W, H);
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    if (drawCover(sctx, sample.width, sample.height)) pixels = sctx.getImageData(0, 0, sample.width, sample.height).data;

    const near = nearest();
    animNow = now;
    // 한동안 못 찾으면 자동 힌트
    if (mode === 'play' && active - lastProgress > AUTO_HINT) { showHint(); lastProgress = active; toast('여기 쪽을 봐요! 👉', 2000); }
    for (const c of chars) {
      const p = screenPos(c);
      const onScreen = p.x > -80 && p.x < W + 80 && p.y > -40 && p.y < H + c.r * 3;
      if (!onScreen) continue;
      if (c.found) {
        // 배경색 → 원래 색으로 물들며 만세
        c.found = Math.min(c.found + dt * 1.5, 1);
        const a = c.tone || hexRgb(c.color), b = hexRgb(c.color), k = c.found;
        const fill = `rgb(${a.map((v, i) => (v + (b[i] - v) * k) | 0).join(',')})`;
        const s = 1 + Math.sin(Math.min(1, c.found * 1.6) * Math.PI) * .35;
        ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s);
        drawChar(ctx, c, 0, 0, fill, 1, 1, 14, true);
        ctx.restore();
        continue;
      }
      if (c.gone) { c.goneT = (c.goneT || 0) + dt; if (c.goneT > 1) continue; }

      // 옷 색이 등 뒤 색을 따라감 (조금 더 밝거나 어둡게 → 아이들도 찾을 수 있게)
      const bg = colorAt(p.x, p.y - c.r * .6);
      if (!c.tone) c.tone = bg.slice();
      for (let i = 0; i < 3; i++) c.tone[i] += (bg[i] + c.shade - c.tone[i]) * Math.min(1, dt * 4);
      const lum = c.tone[0] * .3 + c.tone[1] * .59 + c.tone[2] * .11;
      const line = lum > 140 ? 'rgba(40,30,20,.55)' : 'rgba(255,255,255,.6)';

      c.blink -= dt;
      if (c.blink <= 0) { c.open = .15; c.blink = rand(2.5, 5); }
      c.open = Math.max(0, c.open - dt);
      c.waveCD -= dt;
      if (c.waveCD <= 0) { c.wave = 1.4; c.waveCD = rand(3, 6); }
      c.wave = Math.max(0, c.wave - dt);
      const eyes = c.open > 0 ? .1 : 1;
      const wob = Math.sin(now / 400 + c.phase) * 1.5;
      const fill = `rgb(${c.tone.map(v => clamp(v | 0, 0, 255)).join(',')})`;
      const glow = now < hintUntil && near && c === near.c ? 22 + Math.sin(now / 80) * 10 : 0;
      const alpha = c.gone ? 1 - c.goneT : 1;
      drawChar(ctx, c, p.x, p.y + wob, fill, alpha, eyes, glow, false, line);
      if (c.kind === 'gold' && Math.random() < dt * 3) {
        fx.push({ type: 'spark', x: p.x + rand(-c.r, c.r), y: p.y - c.r * .6 + rand(-c.r * 1.5, c.r), t: 0, life: .6 });
      }
    }

    // 힌트 화살표
    if (mode === 'play' && now < hintUntil && near) {
      const a = Math.atan2(-(near.c.pitch - pitch), wrap(near.c.yaw - yaw));
      ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(a);
      ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(74, 0); ctx.lineTo(42, -17); ctx.lineTo(42, 17); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    // 효과
    fx = fx.filter(f => (f.t += dt) < (f.life || .4));
    for (const f of fx) {
      const k = f.t / (f.life || .4);
      if (f.type === 'ring') {
        ctx.strokeStyle = `rgba(255,255,255,${.8 - k * .8})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(f.x, f.y, 10 + k * 25, 0, Math.PI * 2); ctx.stroke();
      } else if (f.type === 'bit') {
        f.vy += 500 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += dt * 8;
        ctx.save(); ctx.globalAlpha = 1 - k; ctx.translate(f.x, f.y); ctx.rotate(f.rot);
        ctx.fillStyle = f.color; ctx.fillRect(-4, -2.5, 8, 5); ctx.restore();
      } else if (f.type === 'dust') {
        f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .92; f.vy *= .92;
        ctx.fillStyle = `rgba(230,230,230,${.7 * (1 - k)})`;
        ctx.beginPath(); ctx.arc(f.x, f.y, 6 + k * 12, 0, Math.PI * 2); ctx.fill();
      } else if (f.type === 'spark') {
        ctx.fillStyle = `rgba(255,230,120,${1 - k})`; const s = 3 * (1 - k) + 1;
        ctx.beginPath(); ctx.moveTo(f.x, f.y - s * 2); ctx.lineTo(f.x + s * .6, f.y); ctx.lineTo(f.x, f.y + s * 2); ctx.lineTo(f.x - s * .6, f.y); ctx.fill();
      } else if (f.type === 'text') {
        ctx.save(); ctx.globalAlpha = Math.min(1, (1 - k) * 2);
        ctx.font = 'bold 17px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.fillStyle = f.color;
        const yy = f.y - k * 30; ctx.strokeText(f.text, f.x, yy); ctx.fillText(f.text, f.x, yy); ctx.restore();
      }
    }

    if (mode === 'play') updateRadar(dt);
    if (mode !== 'menu') $('time').textContent = total().toFixed(1) + '초';
  }

  resize();
  requestAnimationFrame(frame);
  // 테스트용 접근점
  window.__hide = {
    get chars() { return chars; }, get mode() { return mode; }, get stage() { return stage; }, screenPos,
    get yaw() { return yaw; }, set yaw(v) { yaw = v; }, get pitch() { return pitch; }, set pitch(v) { pitch = v; },
  };
})();
</script>
</body>
</html>
